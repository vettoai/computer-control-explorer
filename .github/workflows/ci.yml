name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # Guards the deliverable: the static export must always succeed and emit out/.
  # Exports the committed mini fixture so the run is hermetic and exercises the full
  # path — including task pages (output: export rejects an empty generateStaticParams).
  static-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: EXPLORER_MODE=export DATASET_DIR="$PWD/src/lib/dataset/__fixtures__/mini" npm run build
      # trailingSlash export → every route is <route>/index.html
      - run: test -f out/index.html
      - run: test -f out/task/alpha-task/index.html
      - run: ls out/task/alpha-task/t/*/index.html # at least one trial page emitted
      - run: echo "static export OK"
